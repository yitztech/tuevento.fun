<div id="tuevento-brand-palette">
  <style>
    #tuevento-brand-palette .palette { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:calc(var(--font-size-base)*1.25); }
    #tuevento-brand-palette figure { margin:0; display:grid; gap:calc(var(--font-size-base)*.35); align-content:start; }
    #tuevento-brand-palette .sample { display:block; width:100%; height:52px; }
    #tuevento-brand-palette figcaption { display:grid; gap:calc(var(--font-size-base)*.2); }
    #tuevento-brand-palette code { color:var(--foreground); }
  </style>
  <div class="palette" role="group" aria-label="Paleta propuesta a partir de los iconos de TuEventoFun">
    <figure>
      <svg class="sample" role="img" aria-label="Fucsia de marca"><rect width="100%" height="100%" fill="#FF0054"/></svg>
      <figcaption><span>Fucsia de marca</span><code>#FF0054</code><span class="text-small">Detalles y celebraciones</span></figcaption>
    </figure>
    <figure>
      <svg class="sample" role="img" aria-label="Fucsia para acciones"><rect width="100%" height="100%" fill="#D9004B"/></svg>
      <figcaption><span>Acciones principales</span><code>#D9004B</code><span class="text-small">Botones y enlaces</span></figcaption>
    </figure>
    <figure>
      <svg class="sample" role="img" aria-label="Fucsia profundo"><rect width="100%" height="100%" fill="#B80040"/></svg>
      <figcaption><span>Fucsia profundo</span><code>#B80040</code><span class="text-small">Hover y pulsación</span></figcaption>
    </figure>
    <figure>
      <svg class="sample" role="img" aria-label="Ciruela oscuro"><rect width="100%" height="100%" fill="#3D002B"/></svg>
      <figcaption><span>Ciruela oscuro</span><code>#3D002B</code><span class="text-small">Títulos y texto principal</span></figcaption>
    </figure>
    <figure>
      <svg class="sample" role="img" aria-label="Malva grisáceo"><rect width="100%" height="100%" fill="#755B6B"/></svg>
      <figcaption><span>Malva grisáceo</span><code>#755B6B</code><span class="text-small">Texto secundario</span></figcaption>
    </figure>
    <figure>
      <svg class="sample" role="img" aria-label="Naranja"><rect width="100%" height="100%" fill="#FF8A00"/></svg>
      <figcaption><span>Naranja</span><code>#FF8A00</code><span class="text-small">Acentos e ilustraciones</span></figcaption>
    </figure>
    <figure>
      <svg class="sample" role="img" aria-label="Amarillo ámbar"><rect width="100%" height="100%" fill="#FFC400"/></svg>
      <figcaption><span>Amarillo ámbar</span><code>#FFC400</code><span class="text-small">Destacados con texto ciruela</span></figcaption>
    </figure>
    <figure>
      <svg class="sample" role="img" aria-label="Blanco"><rect width="100%" height="100%" fill="#FFFFFF"/><rect x=".5" y=".5" width="99%" height="51" fill="none" stroke="var(--border)"/></svg>
      <figcaption><span>Blanco</span><code>#FFFFFF</code><span class="text-small">Panel, tarjetas y formularios</span></figcaption>
    </figure>
    <figure>
      <svg class="sample" role="img" aria-label="Rosa casi blanco"><rect width="100%" height="100%" fill="#FFF7FA"/></svg>
      <figcaption><span>Rosa casi blanco</span><code>#FFF7FA</code><span class="text-small">Fondo del sitio público</span></figcaption>
    </figure>
    <figure>
      <svg class="sample" role="img" aria-label="Rosa suave"><rect width="100%" height="100%" fill="#FFF0F5"/></svg>
      <figcaption><span>Rosa suave</span><code>#FFF0F5</code><span class="text-small">Selección y bloques de apoyo</span></figcaption>
    </figure>
  </div>
</div>
