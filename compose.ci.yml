# ─────────────────────────────────────────────────────────────────────────────
#  CI: Capa de pruebas sobre compose.prod.yml
#  Misma topología que producción, con imágenes construidas en local y puertos
#  expuestos en 127.0.0.1 para los ejecutores de pruebas (E2E / Playwright / API).
#
#    docker compose -f compose.prod.yml -f compose.ci.yml up -d --build --wait
# ─────────────────────────────────────────────────────────────────────────────

services:
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-5187}:80"
    environment:
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-127.0.0.1/32}

  web:
    build:
      context: .
      dockerfile: services/web/Dockerfile
      args:
        RELEASE_SHA: ${RELEASE_SHA:-ci}
    environment:
      SITE_URL_ES: ${SITE_URL_ES:-http://tuevento.localhost:5187}
      SITE_URL_EN: ${SITE_URL_EN:-http://yourevent.localhost:5187}

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      args:
        RELEASE_SHA: ${RELEASE_SHA:-ci}
    ports:
      - "127.0.0.1:${API_PORT:-3087}:3087"
    environment:
      COOKIE_SECURE: "false"
      DEMO_ENABLED: "true"
      RESET_MAX_PER_IP: "1000"
      # Las suites de pruebas salen todas de la misma IP: límites por IP altos (los de cuenta no cambian)
      PUBLIC_RATE_LIMIT_PER_IP: "100000"
      # El global de Fastify también: la web en escritorio, Android e iPhone corre en paralelo
      RATE_LIMIT_MAX: "100000"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5187,http://127.0.0.1:5187,http://tuevento.localhost:5187,http://yourevent.localhost:5187}
      SITE_URL_ES: ${SITE_URL_ES:-http://tuevento.localhost:5187}
      SITE_URL_EN: ${SITE_URL_EN:-http://yourevent.localhost:5187}
      # Las pruebas leen los correos en Mailpit para comprobar idioma, remitente y enlace
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_USER: dev
      SMTP_PASSWORD: dev
      MAIL_FROM: no-reply@tuevento.localhost
      SMTP_USER_EN: dev
      SMTP_PASSWORD_EN: dev
      MAIL_FROM_EN: no-reply@yourevent.localhost
      # Búsqueda en el mapa contra el doble, sin la espera de 1 s entre llamadas de Nominatim
      GEOCODER_URL: http://geocoder-fake:8080
      GEOCODER_MIN_INTERVAL_MS: "0"

  admin:
    build:
      context: .
      dockerfile: services/admin/Dockerfile
    environment:
      # compose.prod.yml exige las variables de Umami (llegan de .env.ci), pero su API solo responde
      # a producción: vacías, el panel funciona sin países, como en local
      UMAMI_API_URL: ""
      UMAMI_API_USER: ""
      UMAMI_API_PASSWORD: ""
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8188}:3088"

  # Buzón de pruebas: la API le entrega los correos; su API REST queda en 127.0.0.1:8026
  mailpit:
    image: axllent/mailpit:v1.31.5
    labels:
      tuevento.solo-pruebas: "true"
    environment:
      # Acepta cualquier usuario SMTP: así se ejercita la autenticación sin TLS
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:${MAIL_UI_PORT:-8026}:8025"
    networks: [frontend]

  # Doble de Nominatim: respuestas fijas para buscar en el mapa sin llamar a OpenStreetMap
  geocoder-fake:
    # Nombre fijo: bake y `compose -p` lo encuentran igual sea cual sea el proyecto
    image: tueventofun-geocoder-fake:ci
    build:
      context: .
      dockerfile: services/geocoder-fake/Dockerfile
    labels:
      tuevento.solo-pruebas: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      retries: 10
    networks: [frontend]
  postgres:
    build:
      context: .
      dockerfile: services/postgres/Dockerfile
    ports:
      - "127.0.0.1:${DB_PORT:-5487}:5432"
