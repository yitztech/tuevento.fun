# Docker DNS can assign a new address when the API container is recreated.
upstream tuevento_api {
  zone tuevento_api 64k;
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 3s;
  server backend:3087 resolve;
}
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 3m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  location /api/ {
    proxy_pass http://tuevento_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
  # Verificación de App Links servida por la API (sin extensión ni redirección).
  location = /.well-known/assetlinks.json { proxy_pass http://tuevento_api/api/.well-known/assetlinks.json; }
  location = /.well-known/apple-app-site-association { proxy_pass http://tuevento_api/api/.well-known/apple-app-site-association; }
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location / { try_files $uri $uri/ /index.html; }
}
