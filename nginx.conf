# Docker DNS can assign a new address when the API container is recreated.
upstream tuevento_api {
  zone tuevento_api 64k;
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 3s;
  server backend:3087 resolve;
}
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 3m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  # El HTTPS externo (si existe) conecta desde una IP privada y añade la IP real del
  # cliente a X-Forwarded-For. Solo se confía en redes privadas; con recursive, Nginx
  # toma la última IP pública, que es la del cliente y no una cabecera falsificada.
  set_real_ip_from 127.0.0.0/8;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  location /api/ {
    proxy_pass http://tuevento_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Sobrescribe la cabecera: la API nunca recibe una cadena que el cliente pueda manipular.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
  # Verificación de App Links servida por la API (sin extensión ni redirección).
  location = /.well-known/assetlinks.json { proxy_pass http://tuevento_api/api/.well-known/assetlinks.json; }
  location = /.well-known/apple-app-site-association { proxy_pass http://tuevento_api/api/.well-known/apple-app-site-association; }
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location / { try_files $uri $uri/ /index.html; }
}
