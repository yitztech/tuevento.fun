name: tueventofun-production
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tueventofun
      POSTGRES_USER: tuevento
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U tuevento -d tueventofun]
      interval: 5s
      retries: 12
    restart: unless-stopped
  backend:
    image: ${IMAGE_BASE:?Set IMAGE_BASE}-api:${IMAGE_TAG:?Set IMAGE_TAG}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://tuevento:${DB_PASSWORD}@postgres:5432/tueventofun
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?Set public HTTPS origin},capacitor://localhost,https://localhost
      COOKIE_SECURE: 'true'
      DEMO_ENABLED: ${DEMO_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      RELEASE_PUBLISH_TOKEN: ${RELEASE_PUBLISH_TOKEN:?Set token}
      RELEASE_DOWNLOAD_HOSTS: ${RELEASE_DOWNLOAD_HOSTS:-github.com,apps.apple.com,testflight.apple.com,play.google.com}
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3087/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 12
    restart: unless-stopped
  frontend:
    image: ${IMAGE_BASE:?Set IMAGE_BASE}-web:${IMAGE_TAG:?Set IMAGE_TAG}
    ports: ['127.0.0.1:${WEB_PORT:-5187}:80']
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'wget -q --spider http://127.0.0.1/api/health']
      interval: 10s
      retries: 12
    restart: unless-stopped
volumes:
  postgres_data:
