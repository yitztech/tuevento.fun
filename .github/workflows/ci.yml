name: Quality checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build && npm run typecheck && npm test
      - run: npx playwright install --with-deps chromium
      - run: bash scripts/setup.sh
      - run: npm run test:api && npm run test:platform && node scripts/test-owner-browser.cjs && npm run test:browser && npm run test:landing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-evidence
          path: qa-artifacts/
      - run: docker compose down -v
        if: always()
