# Checks de cada PR con los nombres comunes de la plataforma (PRU-18, DEP-08):
#
#   Verificar      instalación, lint, tipos, unitarias, build, npm audit, Go (vet, pruebas y govulncheck)
#                  y Trivy sobre las 6 imágenes
#   Escenarios     API, endpoints, e2e (Chromium, Android e iPhone emulados) y recorridos de navegador,
#                  en cuatro partes en paralelo y un job que las agrega
#   Base de datos  tests/db contra PostgreSQL 18 (la imagen del proyecto) y Squawk en migraciones nuevas
#   Seguridad      test:security, CodeQL y ZAP baseline (dos jobs en paralelo y uno que los agrega)
#
# Cada job y cada paso tiene su timeout-minutes, holgado sobre lo que tarda cuando va bien
# (medido en las ejecuciones en verde de oct-2026): si algo se cuelga, falla en minutos.
#
# deploy.yml lo llama (workflow_call) y solo publica las imágenes si los cuatro pasan (DEP-12).
# Las pruebas de las apps móviles siguen solo en local (CLAUDE.md).
name: CI
on:
  pull_request:
  workflow_call:
  # Verificación nocturna contra main (AUDITORIA SEG-08): todo el CI, ZAP incluido, sin publicar
  # (la publicación vive en deploy.yml). Hora escalonada por el tope de jobs de la organización.
  schedule:
    - cron: "40 9 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  TRIVY_IMAGE: aquasec/trivy:0.76.0
jobs:
  verificar:
    name: Verificar
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2
      - uses: actions/setup-node@v7
        timeout-minutes: 3
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        timeout-minutes: 3
      - run: npm run lint
        timeout-minutes: 2
      - run: npm run build
        timeout-minutes: 3
      - run: npm run typecheck
        timeout-minutes: 3
      - run: npm run test:unit
        timeout-minutes: 3
      # Altas y críticas, salvo las excepciones con fecha de scripts/check-audit.mjs
      - run: npm run check:audit
        timeout-minutes: 2
      # Servicio de búsqueda en Go: el build de contracts ya dejó su shared.json embebido
      - uses: actions/setup-go@v7
        timeout-minutes: 3
        with:
          go-version-file: services/search/go.mod
          cache-dependency-path: services/search/go.sum
      - name: Go (formato, vet, pruebas y vulnerabilidades)
        timeout-minutes: 5
        working-directory: services/search
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: docker/setup-buildx-action@v4
        timeout-minutes: 2
      - name: Entorno de imágenes
        timeout-minutes: 1
        run: |
          sed '/^[[:space:]]*#/d; /^[[:space:]]*$/d' .env.ci >> "$GITHUB_ENV"
          echo "SECURITY_REFRESH=$(date -u +%F)" >> "$GITHUB_ENV"
      - name: Construir imágenes
        uses: docker/bake-action@v7.5.0
        timeout-minutes: 10
        with:
          files: |
            compose.prod.yml
            compose.ci.yml
            docker-bake.ci.hcl
          load: true
      - name: Clave diaria de Trivy
        id: trivy-date
        timeout-minutes: 1
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        timeout-minutes: 2
        with:
          path: ~/.cache/trivy
          key: trivy-${{ runner.os }}-${{ env.TRIVY_IMAGE }}-${{ steps.trivy-date.outputs.day }}
          restore-keys: trivy-${{ runner.os }}-${{ env.TRIVY_IMAGE }}-
      - name: Trivy sobre las 6 imágenes
        timeout-minutes: 5
        run: |
          set -a; . ./.env.ci; set +a
          for servicio in gateway web api admin search postgres; do
            echo "::group::$servicio"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache/trivy" "$TRIVY_IMAGE" image \
              --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              "${IMAGE_PREFIX}-${servicio}:${IMAGE_TAG}"
            echo "::endgroup::"
          done
      - name: Permisos de la caché de Trivy
        if: always()
        timeout-minutes: 1
        run: |
          if [ -d "$HOME/.cache/trivy" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$HOME/.cache/trivy"
          fi

  # Partes repartidas por duración, no por número de escenarios (docs/DEPLOYMENT-PERFORMANCE.md):
  # WebKit (iphone-safari) tarda unas 3 veces más por escenario que Chromium, y @disenos (7 tamaños
  # de pantalla por proyecto) suma 128 s solo en WebKit. Con --shard=N/3 sobre todo, la última parte
  # se quedaba casi todo iphone-safari (3:56 frente a 1:19; run 40623833862).
  # Por etiquetas y sin --shard: la parte 1 tardaba 2:30 frente a 1:05 de las mitades de
  # iphone-safari (run 40724065495); @plataforma pasa a la parte 2 en los tres proyectos.
  # Un escenario nuevo entra solo en su parte: las cuatro cubren la suite entera, sin repetir.
  escenarios-partes:
    name: Escenarios (${{ matrix.parte }}/4)
    strategy:
      fail-fast: false
      matrix:
        include:
          # Las de más escenarios (238 y 183) y los más ligeros: 3 workers en los 4 núcleos del runner
          - parte: 1
            filtro: --project=chromium --project=android-chrome --grep-invert "@disenos|@plataforma" --workers=3
          - parte: 2
            filtro: --grep @plataforma --grep-invert @disenos --workers=3
          - parte: 3
            filtro: --project=iphone-safari --grep-invert "@disenos|@plataforma"
          - parte: 4
            filtro: --grep @disenos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2
      # Primero las imágenes y el arranque del entorno, sin esperar a los healthchecks: los
      # contenedores arrancan mientras se instalan Node, las dependencias y los navegadores.
      - uses: docker/setup-buildx-action@v4
        timeout-minutes: 2
      # Las mismas imágenes que se publican (mismos Dockerfiles y caché)
      - name: Entorno de imágenes
        timeout-minutes: 1
        run: |
          sed '/^[[:space:]]*#/d; /^[[:space:]]*$/d' .env.ci >> "$GITHUB_ENV"
          echo "SECURITY_REFRESH=$(date -u +%F)" >> "$GITHUB_ENV"
      - name: Construir imágenes
        uses: docker/bake-action@v7.5.0
        timeout-minutes: 10
        with:
          files: |
            compose.prod.yml
            compose.ci.yml
            docker-bake.ci.hcl
          load: true
          set: "*.cache-to="
      - name: Arrancar el entorno
        run: docker compose -f compose.prod.yml -f compose.ci.yml --env-file .env.ci up -d --no-build
        timeout-minutes: 2
      - uses: actions/setup-node@v7
        timeout-minutes: 3
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        timeout-minutes: 3
      - run: npm run build
        timeout-minutes: 3
      # Navegadores y librerías del sistema desde la caché, sin depender del mirror de apt
      - uses: ./.github/actions/playwright
        timeout-minutes: 3
        with:
          browsers: chromium webkit
      - name: Esperar a que el entorno esté sano
        run: docker compose -f compose.prod.yml -f compose.ci.yml --env-file .env.ci up -d --no-build --wait
        timeout-minutes: 3
      - run: npm run test:api && npm run test:endpoints
        timeout-minutes: 3
      - run: npm run e2e -- ${{ matrix.filtro }}
        timeout-minutes: 12
      - run: npm run e2e:summary
        if: always()
        timeout-minutes: 2
      # En la parte más ligera
      - if: matrix.parte == 4
        run: npm run test:platform && node scripts/test-owner-browser.cjs && npm run test:browser && npm run test:landing && npm run test:password
        timeout-minutes: 3
      - uses: actions/upload-artifact@v7
        if: always()
        timeout-minutes: 3
        with:
          retention-days: 7
          name: qa-evidence-${{ matrix.parte }}
          path: |
            qa-artifacts/
            tests/e2e/results/
      # Sin `docker compose down`: el runner se descarta al terminar el job

  # Conserva el check obligatorio: ninguna parte fallida u omitida puede darlo por bueno.
  escenarios:
    name: Escenarios
    needs: escenarios-partes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Comprobar todas las partes
        timeout-minutes: 1
        env:
          RESULTADO: ${{ needs.escenarios-partes.result }}
        run: test "$RESULTADO" = success

  base-de-datos:
    name: Base de datos
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        timeout-minutes: 3
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        timeout-minutes: 3
      - run: npm run build -w @tuevento/contracts
        timeout-minutes: 2
      # PostgreSQL 18 con los roles y la configuración de producción (services/postgres)
      - name: Arrancar PostgreSQL
        timeout-minutes: 5
        run: |
          docker build -f services/postgres/Dockerfile -t tuevento-postgres .
          docker run -d --name postgres -p 127.0.0.1:5487:5432 \
            -e POSTGRES_DB=tueventofun -e POSTGRES_USER=tuevento -e POSTGRES_PASSWORD=ci-postgres \
            -e API_DB_PASSWORD=ci-api -e ADMIN_DB_PASSWORD=ci-admin -e SEARCH_DB_PASSWORD=ci-search tuevento-postgres
          for _ in $(seq 1 30); do
            docker exec postgres pg_isready -U tuevento -d tueventofun -h 127.0.0.1 && exit 0
            sleep 2
          done
          docker logs postgres
          exit 1
      - run: npm run test:db
        timeout-minutes: 3
        env:
          TEST_DB_PORT: "5487"
          TEST_DB_ADMIN_PASSWORD: ci-postgres
          TEST_DB_API_PASSWORD: ci-api
      # Solo las migraciones nuevas: las ya aplicadas no se tocan (.squawk.toml)
      - name: Squawk sobre las migraciones nuevas
        timeout-minutes: 3
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then base="origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then base="$BEFORE"
          else base="HEAD~1"; fi
          nuevas=$(git diff --name-only --diff-filter=A "$base"...HEAD -- 'apps/api/migrations/*.sql')
          if [ -z "$nuevas" ]; then echo "Sin migraciones nuevas."; exit 0; fi
          echo "$nuevas"
          echo "$nuevas" | xargs npx --yes squawk-cli@2.70.0

  # CodeQL del servicio Go: compila con build-mode manual (el de JS y Actions va sin compilar)
  codeql-go:
    name: CodeQL Go
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2
      - uses: actions/setup-node@v7
        timeout-minutes: 3
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        timeout-minutes: 3
      - run: npm run build -w @tuevento/contracts
        timeout-minutes: 2
      - uses: actions/setup-go@v7
        timeout-minutes: 3
        with:
          go-version-file: services/search/go.mod
          cache-dependency-path: services/search/go.sum
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        timeout-minutes: 3
        with:
          languages: go
          build-mode: manual
      - run: go build ./...
        timeout-minutes: 3
        working-directory: services/search
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        timeout-minutes: 5

  # CodeQL (JS/TS y Actions) y ZAP van en paralelo: juntos, CodeQL retrasaba 1:40 la construcción
  # y ZAP, y Seguridad era la ruta crítica una vez equilibrados los escenarios.
  seguridad-codeql:
    name: Seguridad · CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2
      - uses: actions/setup-node@v7
        timeout-minutes: 3
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        timeout-minutes: 3
      - run: npm run build
        timeout-minutes: 3
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        timeout-minutes: 3
        with:
          languages: javascript-typescript, actions
          build-mode: none
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        timeout-minutes: 5

  seguridad-zap:
    name: Seguridad · API y ZAP
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2
      # Como en Escenarios: el entorno arranca mientras se instalan Node y las dependencias
      - uses: docker/setup-buildx-action@v4
        timeout-minutes: 2
      - name: Entorno de imágenes
        timeout-minutes: 1
        run: |
          sed '/^[[:space:]]*#/d; /^[[:space:]]*$/d' .env.ci >> "$GITHUB_ENV"
          echo "SECURITY_REFRESH=$(date -u +%F)" >> "$GITHUB_ENV"
      - name: Construir imágenes
        uses: docker/bake-action@v7.5.0
        timeout-minutes: 10
        with:
          files: |
            compose.prod.yml
            compose.ci.yml
            docker-bake.ci.hcl
          load: true
          set: "*.cache-to="
      - name: Arrancar el entorno
        run: docker compose -f compose.prod.yml -f compose.ci.yml --env-file .env.ci up -d --no-build
        timeout-minutes: 2
      - uses: actions/setup-node@v7
        timeout-minutes: 3
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        timeout-minutes: 3
      - run: npm run build
        timeout-minutes: 3
      - name: Esperar a que el entorno esté sano
        run: docker compose -f compose.prod.yml -f compose.ci.yml --env-file .env.ci up -d --no-build --wait
        timeout-minutes: 3
      - run: npm run test:security
        timeout-minutes: 3
      # Falla con cualquier aviso nuevo (AUDITORIA SEG-08); las excepciones, con su motivo, en
      # tests/security/zap-reglas.tsv. El informe queda en el artefacto zap_scan
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        timeout-minutes: 5
        with:
          target: http://localhost:5187
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0
          rules_file_name: tests/security/zap-reglas.tsv
          allow_issue_writing: false
          fail_action: true
      # Sin `docker compose down`: el runner se descarta al terminar el job

  # Conserva el check obligatorio `Seguridad`, como `Escenarios` con sus partes.
  seguridad:
    name: Seguridad
    needs: [seguridad-codeql, seguridad-zap]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Comprobar CodeQL y ZAP
        timeout-minutes: 1
        env:
          CODEQL: ${{ needs.seguridad-codeql.result }}
          ZAP: ${{ needs.seguridad-zap.result }}
        run: test "$CODEQL" = success && test "$ZAP" = success
