name: Quality checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build && npm run typecheck && npm run test:unit
      # Chromium pesa ~150 MB: se reutiliza mientras no cambie la versión de Playwright
      - id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - uses: docker/setup-buildx-action@v4
      # Las capas de las imágenes se guardan en la caché de GitHub Actions entre ejecuciones
      - name: Construir imágenes
        run: |
          set -a; . ./.env.ci; set +a
          docker buildx bake -f compose.prod.yml -f compose.ci.yml --load \
            --set '*.cache-from=type=gha' --set '*.cache-to=type=gha,mode=max'
      - run: docker compose -f compose.prod.yml -f compose.ci.yml --env-file .env.ci up -d --no-build --wait
      # La API sirve a varios clientes (web, Android, iOS): sus pruebas siempre corren en CI.
      # Las de base de datos (tests/db) y las móviles son solo locales, ver docs/TESTS.md.
      - run: npm run test:api && npm run test:endpoints && npm run test:security
      - run: npm run e2e
      - run: npm run e2e:summary
        if: always()
      - run: npm run test:platform && node scripts/test-owner-browser.cjs && npm run test:browser && npm run test:landing && npm run test:password
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qa-evidence
          path: |
            qa-artifacts/
            tests/e2e/results/
      - run: docker compose -f compose.prod.yml -f compose.ci.yml --env-file .env.ci down -v
        if: always()
