name: Publish approved app link
on:
  workflow_dispatch:
    inputs:
      platform: {type: choice, options: [ios, android], required: true}
      channel: {type: choice, options: [testflight, store], required: true}
      version: {required: true, description: 'Version x.y.z'}
      build: {required: true, description: 'Already approved build number'}
      url: {required: true, description: 'Approved public TestFlight or store URL'}
permissions: {contents: read}
jobs:
  publish:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2
      - uses: actions/setup-node@v7
        timeout-minutes: 3
        with: {node-version-file: .nvmrc, cache: npm}
      - run: npm ci && npm run build -w @tuevento/contracts
        timeout-minutes: 5
      - run: node scripts/publish-release.mjs
        timeout-minutes: 3
        env:
          RELEASE_PLATFORM: ${{ inputs.platform }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          APP_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build }}
          RELEASE_URL: ${{ inputs.url }}
          # Nombre que lee scripts/publish-release.mjs; el valor es SITE_URL de la plataforma
          PUBLIC_ORIGIN: ${{ vars.SITE_URL }}
          RELEASE_PUBLISH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
