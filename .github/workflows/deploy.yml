# Publica las imágenes en GHCR y despliega en Coolify cuando cambia main.
#
#   CI (Verificar, Escenarios, Base de datos y Seguridad) ┐
#                                                         ├→ promover (:main) → desplegar (webhook de
#   publicar (:<sha> de las 6 imágenes)                   ┘   Coolify) → comprobar la versión → humo
#
# Publicar corre en paralelo con el CI, pero solo con la etiqueta del SHA. `:main`, la que usa
# producción, la mueve `promover` cuando el CI pasa (DEP-14): un commit que falla nunca la toca.
#
# El entorno `production` (secretos COOLIFY_WEBHOOK y COOLIFY_TOKEN, variables SITE_URL y
# SITE_URL_EN) lo rellena la plataforma. Mientras no exista, se publican las imágenes
# pero no se despliega. Solo despliega desde main.
name: Desplegar

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Los mismos checks que en cada PR: no se publica nada sin los escenarios en verde (DEP-12)
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read
      security-events: write

  publicar:
    name: Publicar ${{ matrix.name }}
    # En paralelo con el CI: solo :<sha>, que producción no usa hasta que `promover` la copia a :main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: gateway
            build_args: ""
          # /version.json lo sirve web: confirma que el frontend nuevo ya está en marcha
          - name: web
            build_args: |
              RELEASE_SHA=${{ github.sha }}
              SENTRY_DSN=${{ vars.SENTRY_DSN }}
          # Valores públicos de los App Links (/.well-known/*), en vars del repositorio
          - name: api
            build_args: |
              RELEASE_SHA=${{ github.sha }}
              ANDROID_CERT_SHA256=${{ vars.ANDROID_CERT_SHA256 }}
              APPLE_TEAM_ID=${{ vars.APPLE_TEAM_ID }}
              MOBILE_APP_ID=${{ vars.MOBILE_APP_ID || 'com.tueventofun.app' }}
          # Panel de administración (subdominio admin): Node + Angular, sin build args
          - name: admin
            build_args: ""
          # Búsqueda de proveedores (Go): idiomas y textos de packages/contracts, embebidos
          - name: search
            build_args: |
              RELEASE_SHA=${{ github.sha }}
          - name: postgres
            build_args: ""
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2
      - uses: docker/setup-buildx-action@v4
        timeout-minutes: 2
      - uses: docker/login-action@v4
        timeout-minutes: 2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR exige minúsculas: ghcr.io/yitztech/tuevento.fun-gateway, -web, -api, -admin, -search y -postgres
      - id: image
        timeout-minutes: 1
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
          echo "security_refresh=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        timeout-minutes: 12
        with:
          context: .
          file: services/${{ matrix.name }}/Dockerfile
          push: true
          build-args: |
            ${{ matrix.build_args }}
            SECURITY_REFRESH=${{ steps.image.outputs.security_refresh }}
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,timeout=2m,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,timeout=2m,ignore-error=true,scope=${{ matrix.name }}
          provenance: true
          sbom: true

  promover:
    name: Promover a main
    needs: [ci, publicar]
    # La etiqueta :main solo puede salir de main (también con workflow_dispatch)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
        timeout-minutes: 2
      - uses: docker/login-action@v4
        timeout-minutes: 2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Copia el manifiesto en el registro, sin reconstruir: :main queda idéntica a :<sha>
      - name: Mover :main al SHA
        timeout-minutes: 3
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for name in gateway web api admin search postgres; do
            image="ghcr.io/${REPOSITORY,,}-${name}"
            docker buildx imagetools create --tag "${image}:main" "${image}:${SHA}"
          done

  desplegar:
    name: Desplegar en Coolify
    needs: promover
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: ¿Coolify está configurado?
        timeout-minutes: 1
        id: coolify
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_URL_EN: ${{ vars.SITE_URL_EN }}
        run: |
          if [ -n "$COOLIFY_WEBHOOK" ] && [ -n "$COOLIFY_TOKEN" ] && [ -n "$SITE_URL" ] && [ -n "$SITE_URL_EN" ]; then
            echo "listo=true" >> "$GITHUB_OUTPUT"
          else
            echo "listo=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Imágenes publicadas, pero no se despliega: faltan COOLIFY_WEBHOOK, COOLIFY_TOKEN, SITE_URL o SITE_URL_EN en el entorno production (los pone la plataforma)."
          fi

      - name: Pedir el despliegue a Coolify
        timeout-minutes: 5
        if: steps.coolify.outputs.listo == 'true'
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          # Coolify (4.3.x) solo despliega con POST
          curl --fail-with-body --silent --show-error --retry 3 --max-time 60 \
            --request POST --header "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK"

      # Cada redespliegue corta el sitio ~1 minuto (Coolify para y arranca los
      # contenedores): se espera a que los dos dominios sirvan el commit nuevo.
      - name: Comprobar que la versión nueva ya sirve en los dos dominios
        timeout-minutes: 12
        if: steps.coolify.outputs.listo == 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_URL_EN: ${{ vars.SITE_URL_EN }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 120); do
            es=$(curl --fail --silent --max-time 10 "$SITE_URL/version.json" | jq -r '.revision' || true)
            en=$(curl --fail --silent --max-time 10 "$SITE_URL_EN/version.json" | jq -r '.revision' || true)
            if [ "$es" = "$EXPECTED_SHA" ] && [ "$en" = "$EXPECTED_SHA" ]; then
              echo "Desplegado: $EXPECTED_SHA en $SITE_URL y $SITE_URL_EN"
              exit 0
            fi
            if [ "$attempt" -eq 120 ]; then
              echo "::error::Coolify no sirvió la revisión esperada en 10 minutos (es: $es, en: $en)."
              exit 1
            fi
            sleep 5
          done

      # Prueba de humo con reintentos en los dos dominios y en el panel (DEP-11)
      - name: Prueba de humo
        timeout-minutes: 5
        if: steps.coolify.outputs.listo == 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_URL_EN: ${{ vars.SITE_URL_EN }}
          ADMIN_URL: ${{ vars.ADMIN_URL || 'https://admin.tuevento.fun' }}
        run: |
          comprobar() {
            for _ in $(seq 1 10); do
              if "$@"; then return 0; fi
              sleep 6
            done
            return 1
          }
          # shellcheck disable=SC2329 # se llaman a través de comprobar
          salud() { [ "$(curl --fail --silent --max-time 10 "$1/api/health" | jq -r '.status')" = "ok" ]; }
          # shellcheck disable=SC2329
          pagina() { curl --fail --silent --output /dev/null --max-time 15 "$1/"; }
          fallos=0
          for url in "$SITE_URL" "$SITE_URL_EN"; do
            comprobar salud "$url" || { echo "::error::$url/api/health no responde {\"status\":\"ok\"}"; fallos=1; }
            comprobar pagina "$url" || { echo "::error::La portada de $url no responde 200"; fallos=1; }
          done
          comprobar pagina "$ADMIN_URL" || { echo "::error::$ADMIN_URL no responde 200"; fallos=1; }
          [ "$fallos" -eq 0 ] && echo "Humo correcto en $SITE_URL, $SITE_URL_EN y $ADMIN_URL"
          exit "$fallos"
