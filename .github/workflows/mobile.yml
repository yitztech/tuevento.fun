# Secretos (entorno `production`, como en los demás proyectos):
#   ANDROID_RELEASE_KEYSTORE_BASE64  base64 de ~/.tuevento-secrets/android/release.keystore
#   ANDROID_SIGNING_JSON             contenido de ~/.tuevento-secrets/android/signing.json
#                                    ({"alias":"…","password":"…"}; misma contraseña para almacén y clave)
# Tienen que ser SIEMPRE los mismos: con otra clave, Android no actualiza sobre la
# versión instalada y los App Links dejan de verificarse.
name: Release Android and iOS
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version, e.g. 1.0.0'
        required: true
      platform:
        type: choice
        options: [android, ios, both]
        default: both
      publish_catalog:
        type: boolean
        default: false
        description: 'Publish verified distribution links to the website'
permissions:
  contents: read
concurrency:
  group: mobile-release
  cancel-in-progress: false
jobs:
  android:
    if: inputs.platform == 'android' || inputs.platform == 'both'
    environment: production
    runs-on: ubuntu-latest
    permissions: {contents: write}
    env:
      APP_VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}
      VITE_APP_VERSION: ${{ inputs.version }}
      VITE_PUBLIC_ORIGIN: ${{ vars.SITE_URL }}
      MOBILE_APP_ID: ${{ vars.MOBILE_APP_ID || 'com.tueventofun.app' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: 24, cache: npm}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v4
      - run: npm ci && npm run build -w @tuevento/contracts && npm run build -w @tuevento/client && npm run typecheck && npm run test:unit && node scripts/validate-mobile-env.mjs
      - run: npm run build && npx cap sync android
        working-directory: apps/web
      - name: Clave de firma
        env:
          KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          SIGNING: ${{ secrets.ANDROID_SIGNING_JSON }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$SIGNING" ]; then
            echo "::error::Faltan ANDROID_RELEASE_KEYSTORE_BASE64 o ANDROID_SIGNING_JSON en el entorno production."
            exit 1
          fi
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          alias=$(printf '%s' "$SIGNING" | jq -r '.alias')
          password=$(printf '%s' "$SIGNING" | jq -r '.password')
          echo "::add-mask::$password"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEY_ALIAS=$alias"
            echo "ANDROID_KEYSTORE_PASSWORD=$password"
            echo "ANDROID_KEY_PASSWORD=$password"
          } >> "$GITHUB_ENV"
      - name: Build signed APK and Play bundle
        working-directory: apps/web/android
        run: ./gradlew assembleRelease bundleRelease
      - name: Publish downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apps/web/android/app/build/outputs/apk/release/app-release.apk TuEventoFun.apk
          cp apps/web/android/app/build/outputs/bundle/release/app-release.aab TuEventoFun.aab
          sha256sum TuEventoFun.apk > SHA256SUMS
          gh release create "app-android-v${APP_VERSION}-${BUILD_NUMBER}" TuEventoFun.apk TuEventoFun.aab SHA256SUMS --title "Android ${APP_VERSION} (${BUILD_NUMBER})" --notes "Android release" --target "$GITHUB_SHA"
          echo "RELEASE_SHA256=$(cut -d ' ' -f1 SHA256SUMS)" >> "$GITHUB_ENV"
          echo "RELEASE_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/app-android-v${APP_VERSION}-${BUILD_NUMBER}/TuEventoFun.apk" >> "$GITHUB_ENV"
      - name: Update website catalog
        if: inputs.publish_catalog
        env:
          RELEASE_PLATFORM: android
          RELEASE_CHANNEL: direct
          RELEASE_PUBLISH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
          # Nombre que lee scripts/publish-release.mjs; el valor es SITE_URL de la plataforma
          PUBLIC_ORIGIN: ${{ vars.SITE_URL }}
        run: |
          curl --fail --head --location "$RELEASE_URL"
          npm run build -w @tuevento/contracts
          node scripts/publish-release.mjs
      - if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
  ios:
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: macos-15
    environment: production
    env:
      APP_VERSION: ${{ inputs.version }}
      VITE_APP_VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}
      VITE_PUBLIC_ORIGIN: ${{ vars.SITE_URL }}
      MOBILE_APP_ID: ${{ vars.MOBILE_APP_ID || 'com.tueventofun.app' }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: 24, cache: npm}
      - run: npm ci && npm run build -w @tuevento/contracts && npm run build -w @tuevento/client && npm run typecheck && npm run test:unit && node scripts/validate-mobile-env.mjs
      - run: npm run build && npx cap sync ios
        working-directory: apps/web
      - name: Install distribution identity
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: bash scripts/ios-signing.sh
      - name: Resolve App Links host
        run: echo "APP_LINK_HOST=$(node -p 'new URL(process.env.VITE_PUBLIC_ORIGIN).host')" >> "$GITHUB_ENV"
      - name: Archive and export
        run: |
          xcodebuild -project apps/web/ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" archive CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$APPLE_TEAM_ID" APP_LINK_HOST="$APP_LINK_HOST" PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_UUID" CODE_SIGN_IDENTITY='Apple Distribution' PRODUCT_BUNDLE_IDENTIFIER="$MOBILE_APP_ID" MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportPath "$RUNNER_TEMP/ipa" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      - name: Upload to App Store Connect for TestFlight processing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app -f "$RUNNER_TEMP/ipa/App.ipa" --type ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - uses: actions/upload-artifact@v7
        with:
          name: ios-distribution
          path: ${{ runner.temp }}/ipa/*.ipa
      - if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/profile.mobileprovision"
          rm -rf ~/.appstoreconnect/private_keys
# iOS catalog is published separately AFTER Apple processing/review, never on upload success.
