# ─────────────────────────────────────────────────────────────────────────────
#  PRODUCCIÓN en Coolify (aplicación Docker Compose)
#
#  Las imágenes las publica GitHub Actions en GHCR (.github/workflows/deploy.yml):
#  el servidor solo las descarga y arranca, nunca compila. Coolify lee este
#  archivo del repositorio y su Traefik pone los dominios y los certificados.
#
#  Reglas de la plataforma:
#  - Dominios (tuevento.fun y yourevent.fun): SOLO al servicio `gateway`, puerto 80.
#  - Ningún servicio publica puertos: solo el gateway es alcanzable, y solo desde Traefik.
#  - Todo servicio lleva límite de memoria y CPU: varios clientes comparten servidor.
#  - Todo lo que termina en `:?` es obligatorio: si falta, el despliegue se detiene.
#  - Variables: solo las que pasa la plataforma (ver README-project.md).
# ─────────────────────────────────────────────────────────────────────────────

x-hardening: &hardening
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  gateway:
    <<: *hardening
    image: ${IMAGE_PREFIX:?Define IMAGE_PREFIX, p. ej. ghcr.io/yitztech/tuevento.fun}-gateway:${IMAGE_TAG:-main}
    # Corre como 101:101 (nginx) sin capacidades; solo escribe en los tmpfs
    read_only: true
    tmpfs: ["/tmp:uid=101,gid=101", "/var/cache/nginx:uid=101,gid=101", "/etc/nginx/conf.d:uid=101,gid=101"]
    mem_limit: 64m
    cpus: 0.25
    environment:
      # Subred de la red de esta app donde está Traefik (se mide tras el primer arranque)
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:?Define la subred de Traefik}
      # Subdominio del panel de administración (solo ese host llega a `admin`)
      ADMIN_HOST: ${ADMIN_HOST:-admin.tuevento.fun}
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_started }
    # /healthz lo responde el propio nginx, sin depender de web ni de api
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [frontend]

  # Frontend: la SPA estática. El gateway le reenvía el Host, y aquí se decide el idioma.
  web:
    <<: *hardening
    image: ${IMAGE_PREFIX:?Define IMAGE_PREFIX}-web:${IMAGE_TAG:-main}
    # Escucha en 8080: arranca como root y baja a su usuario, sin NET_BIND_SERVICE
    cap_add: [CHOWN, SETGID, SETUID]
    # Solo escribe la configuración generada al arrancar (conf.d, seo) y su caché, en tmpfs
    read_only: true
    tmpfs: [/tmp, /run, /var/cache/nginx, /etc/nginx/conf.d, /etc/nginx/seo]
    mem_limit: 64m
    cpus: 0.25
    environment:
      # Un idioma por dominio: el Host decide es/en, canonical, hreflang, robots y sitemap
      SITE_URL_ES: ${SITE_URL_ES:?Define SITE_URL_ES}
      SITE_URL_EN: ${SITE_URL_EN:?Define SITE_URL_EN}
      # Analítica con Umami (vacío = sin analítica)
      UMAMI_SCRIPT_URL: ${UMAMI_SCRIPT_URL:-}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [frontend]

  api:
    <<: *hardening
    image: ${IMAGE_PREFIX:?Define IMAGE_PREFIX}-api:${IMAGE_TAG:-main}
    # Corre como usuario node en el puerto 3087: no necesita capacidades
    read_only: true
    tmpfs: [/tmp]
    # Fotos de las postales: el único sitio escribible además de /tmp
    volumes:
      - postcard_images:/data/postcards
      # Fotos de los proveedores: termina en _uploads para que el backup de la plataforma lo copie
      - provider_uploads:/data/providers
    mem_limit: 256m
    cpus: 0.5
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=192
      # La API se conecta como rol `api` (no como dueño de la base)
      DATABASE_URL: postgres://api@postgres:5432/tueventofun
      PGPASSWORD: ${API_DB_PASSWORD:?Define API_DB_PASSWORD}
      # Los dos dominios de la web y los orígenes de las apps Capacitor
      ALLOWED_ORIGINS: ${SITE_URL_ES:?Define SITE_URL_ES},${SITE_URL_EN:?Define SITE_URL_EN},capacitor://localhost,https://localhost
      SITE_URL_ES: ${SITE_URL_ES:?Define SITE_URL_ES}
      SITE_URL_EN: ${SITE_URL_EN:?Define SITE_URL_EN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Correo transaccional (recuperar contraseña). Sin sufijo = es (tuevento.fun),
      # _EN = en (yourevent.fun): cada usuario lo recibe desde el dominio por el que entró.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_USER_EN: ${SMTP_USER_EN:-}
      SMTP_PASSWORD_EN: ${SMTP_PASSWORD_EN:-}
      MAIL_FROM_EN: ${MAIL_FROM_EN:-}
      # Newsletter: un Listmonk por idioma, en news. de cada dominio (suscripción pública)
      LISTMONK_URL: ${LISTMONK_URL:-}
      LISTMONK_LIST_UUID: ${LISTMONK_LIST_UUID:-}
      LISTMONK_URL_EN: ${LISTMONK_URL_EN:-}
      LISTMONK_LIST_UUID_EN: ${LISTMONK_LIST_UUID_EN:-}
      RELEASE_PUBLISH_TOKEN: ${RELEASE_PUBLISH_TOKEN:?Define RELEASE_PUBLISH_TOKEN}
      # Clave de los enlaces de invitación cifrados y de los enlaces firmados de los correos
      APP_SECRET: ${APP_SECRET:?Define APP_SECRET}
      # Pagos con Stripe Checkout: vacías = pagos apagados (sin cobro ni límites por plan)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      COOKIE_SECURE: "true"
      DEMO_ENABLED: "false"
      RELEASE_DOWNLOAD_HOSTS: github.com,apps.apple.com,testflight.apple.com,play.google.com
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3087/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    # frontend: la alcanza el gateway. backend: solo ella habla con postgres.
    networks: [frontend, backend]

  # Panel de administración (subdominio ADMIN_HOST, solo el administrador). Node sin framework +
  # interfaz en Angular. Lee la base con el rol `admin_ro` (solo SELECT sobre lo que muestra el panel).
  admin:
    <<: *hardening
    image: ${IMAGE_PREFIX:?Define IMAGE_PREFIX}-admin:${IMAGE_TAG:-main}
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 128m
    cpus: 0.25
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=96
      PORT: "3088"
      DATABASE_URL: postgres://admin_ro@postgres:5432/tueventofun
      PGPASSWORD: ${ADMIN_DB_PASSWORD:?Define ADMIN_DB_PASSWORD}
      # Usuario y hash de la contraseña del administrador (hash: npm run hash-password -w @tuevento/admin)
      ADMIN_USER: ${ADMIN_USER:?Define ADMIN_USER}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Define ADMIN_PASSWORD_HASH}
      COOKIE_SECURE: "true"
      # Visitantes por país: los lee de Umami con un usuario de solo lectura (la red frontend tiene salida)
      UMAMI_API_URL: ${UMAMI_API_URL:?Define UMAMI_API_URL}
      UMAMI_API_USER: ${UMAMI_API_USER:?Define UMAMI_API_USER}
      UMAMI_API_PASSWORD: ${UMAMI_API_PASSWORD:?Define UMAMI_API_PASSWORD}
      # El mismo sitio de Umami para los dos dominios
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-a9bab77a-9e00-4815-8007-7a3d3f78b0ab}
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3088/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    # frontend: la alcanza el gateway (solo para su subdominio). backend: habla con postgres.
    networks: [frontend, backend]

  # Búsqueda de proveedores (Go, services/search): GET /api/search/ a través del gateway. Lee solo
  # la tabla provider_search con el rol `search_ro`. Binario estático sobre scratch, sin root.
  search:
    <<: *hardening
    image: ${IMAGE_PREFIX:?Define IMAGE_PREFIX}-search:${IMAGE_TAG:-main}
    read_only: true
    mem_limit: 64m
    cpus: 0.25
    environment:
      DATABASE_URL: postgres://search_ro@postgres:5432/tueventofun
      PGPASSWORD: ${SEARCH_DB_PASSWORD:?Define SEARCH_DB_PASSWORD}
      # Los mismos orígenes que la API: las apps Capacitor leen la búsqueda desde otro origen
      ALLOWED_ORIGINS: ${SITE_URL_ES:?Define SITE_URL_ES},${SITE_URL_EN:?Define SITE_URL_EN},capacitor://localhost,https://localhost
      SITE_URL_ES: ${SITE_URL_ES:?Define SITE_URL_ES}
      SITE_URL_EN: ${SITE_URL_EN:?Define SITE_URL_EN}
      # ~90 % del límite de memoria (AGENTS.md §20)
      GOMEMLIMIT: 56MiB
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: [CMD, /search, healthcheck]
      interval: 10s
      timeout: 5s
      retries: 12
    # frontend: la alcanza el gateway. backend: habla con postgres.
    networks: [frontend, backend]

  # La plataforma hace el backup de cada contenedor PostgreSQL en marcha.
  postgres:
    <<: *hardening
    image: ${IMAGE_PREFIX:?Define IMAGE_PREFIX}-postgres:${IMAGE_TAG:-main}
    # El entrypoint arranca como root, ajusta el dueño del directorio de datos (CHOWN),
    # lo recorre ya siendo de postgres en cada rearranque (DAC_READ_SEARCH) y baja a
    # ese usuario (SETGID, SETUID). Mínimo comprobado con volumen nuevo y existente.
    cap_add: [CHOWN, DAC_READ_SEARCH, SETGID, SETUID]
    # Escribe solo en su volumen; el socket y los temporales, en tmpfs
    read_only: true
    tmpfs: [/tmp, /var/run/postgresql]
    mem_limit: 512m
    cpus: 1.0
    environment:
      POSTGRES_DB: tueventofun
      POSTGRES_USER: tuevento
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?Define API_DB_PASSWORD}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:?Define ADMIN_DB_PASSWORD}
      SEARCH_DB_PASSWORD: ${SEARCH_DB_PASSWORD:?Define SEARCH_DB_PASSWORD}
    volumes:
      # PostgreSQL 18: el volumen se monta en /var/lib/postgresql (no en /data)
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U tuevento -d tueventofun"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [backend]

volumes:
  postgres_data:
  postcard_images:
  provider_uploads:

networks:
  frontend:
  backend:
    internal: true    # sin salida a internet: solo api ↔ postgres
