# Cabeceras de seguridad de las páginas. Se incluyen en cada `location` que sirve
# HTML: en nginx un `add_header` dentro de una location anula los heredados.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# same-origin-allow-popups (no same-origin): el acceso con Google abre un popup que
# debe poder devolver la credencial a esta ventana.
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Todo se sirve desde el propio dominio salvo Google Identity Services (botón y popup
# de acceso con Google): su script, estilos, iframe y llamadas viven en accounts.google.com.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/$analytics_src; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://accounts.google.com$analytics_src; frame-src https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
