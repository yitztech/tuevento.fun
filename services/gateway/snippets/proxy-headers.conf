proxy_http_version 1.1;
# Host tal cual lo pidió el cliente, con puerto si lo trae (localhost:5187 en local):
# web y api deciden el idioma y forman los enlaces con él
proxy_set_header Host              $forward_host;
proxy_set_header X-Real-IP         $remote_addr;
# Se sobrescribe (no se concatena) para que el cliente no pueda inyectar IPs
# falsas en X-Forwarded-For: la app solo confía en este salto.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
# Keepalive con el upstream; WebSocket solo si el cliente lo pide ($connection_upgrade)
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
