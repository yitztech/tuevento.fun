# ─────────────────────────────────────────────────────────────────────────────
#  DESARROLLO local: misma topología que producción con recarga en caliente.
#    docker compose up --watch
#  Todas las variables tienen valores por defecto de desarrollo (sin setup.sh obligatorio).
#  Mismos servicios que producción (gateway, web, api, postgres) más Mailpit,
#  que atrapa los correos: http://127.0.0.1:8026
# ─────────────────────────────────────────────────────────────────────────────
name: tueventofun

services:
  postgres:
    build:
      context: .
      dockerfile: services/postgres/Dockerfile
    environment:
      POSTGRES_DB: tueventofun
      POSTGRES_USER: tuevento
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-postgres}
      API_DB_PASSWORD: ${API_DB_PASSWORD:-dev-api}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:-dev-admin}
    ports:
      - "127.0.0.1:${DB_PORT:-5487}:5432"
    volumes:
      # PostgreSQL 18: el volumen se monta en /var/lib/postgresql (no en /data)
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuevento -d tueventofun"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      target: dev
    environment:
      NODE_ENV: development
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=512}
      PORT: 3087
      DATABASE_URL: postgres://api@postgres:5432/tueventofun
      PGPASSWORD: ${API_DB_PASSWORD:-dev-api}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5187,http://127.0.0.1:5187,https://tueventofun.orb.local,http://tueventofun.orb.local,https://en.tueventofun.orb.local,http://en.tueventofun.orb.local,http://en.tueventofun.orb.local:5187,https://gateway.tueventofun.orb.local,http://gateway.tueventofun.orb.local}
      SITE_URL_ES: ${SITE_URL_ES:-https://tueventofun.orb.local}
      SITE_URL_EN: ${SITE_URL_EN:-https://en.tueventofun.orb.local}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Correo: Mailpit recibe todo en local (http://127.0.0.1:8026); un remitente por dominio
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-dev}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-dev}
      MAIL_FROM: ${MAIL_FROM:-TuEventoFun <no-reply@tueventofun.orb.local>}
      SMTP_USER_EN: ${SMTP_USER_EN:-dev}
      SMTP_PASSWORD_EN: ${SMTP_PASSWORD_EN:-dev}
      MAIL_FROM_EN: ${MAIL_FROM_EN:-TuEventoFun <no-reply@en.tueventofun.orb.local>}
      # Newsletter: un Listmonk por idioma (vacío = solo se guarda en la base de datos)
      LISTMONK_URL: ${LISTMONK_URL:-}
      LISTMONK_LIST_UUID: ${LISTMONK_LIST_UUID:-}
      LISTMONK_URL_EN: ${LISTMONK_URL_EN:-}
      LISTMONK_LIST_UUID_EN: ${LISTMONK_LIST_UUID_EN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      RELEASE_PUBLISH_TOKEN: ${RELEASE_PUBLISH_TOKEN:-dev-release-token}
      RELEASE_DOWNLOAD_HOSTS: ${RELEASE_DOWNLOAD_HOSTS:-github.com,apps.apple.com,testflight.apple.com,play.google.com}
      DEMO_ENABLED: ${DEMO_ENABLED:-true}
      # Las suites de la API piden restablecer contraseña muchas veces desde la misma IP
      RESET_MAX_PER_IP: ${RESET_MAX_PER_IP:-1000}
    volumes:
      # Fotos de las postales (el contenedor es el único que las escribe)
      - postcard_images:/data/postcards
    ports:
      - "127.0.0.1:${API_PORT:-3087}:3087"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3087/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    develop:
      watch:
        - path: apps/api/src
          target: /app/apps/api/src
          action: sync
        - path: packages/contracts/src
          target: /app/packages/contracts/src
          action: sync
        - path: packages/client/src
          target: /app/packages/client/src
          action: sync
        - path: package.json
          action: rebuild
        - path: package-lock.json
          action: rebuild

  # Panel de administración en local: http://127.0.0.1:8188 (usuario y contraseña de desarrollo;
  # en producción se definen en la plataforma). Contraseña de desarrollo: admin-dev-password
  admin:
    build:
      context: .
      dockerfile: services/admin/Dockerfile
    environment:
      PORT: "3088"
      DATABASE_URL: postgres://admin_ro@postgres:5432/tueventofun
      PGPASSWORD: ${ADMIN_DB_PASSWORD:-dev-admin}
      ADMIN_USER: ${ADMIN_USER:-admin-dev}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-scrypt:16384:8:1:vKfbBhhXYX+qW1vUnexl2w==:B15jwpqpCexk35DEqPj7PXKzWIh8Ih8R8K5Hlyu2bpUIxgHSJcBb3cZ7BwhxZEhAcNxuo7qR3v/iNFzkNcUwuQ==}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Las pruebas entran una y otra vez desde la misma IP: sin este límite se bloquearían solas
      ADMIN_MAX_FAILURES: ${ADMIN_MAX_FAILURES:-1000}
      # Sin Umami en local (su API solo responde al servidor de producción): el panel lo indica
      UMAMI_API_URL: ${UMAMI_API_URL:-}
      UMAMI_API_USER: ${UMAMI_API_USER:-}
      UMAMI_API_PASSWORD: ${UMAMI_API_PASSWORD:-}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8188}:3088"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3088/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Buzón de pruebas: atrapa todos los correos de la API (como en micitaentiempo).
  # Interfaz: http://127.0.0.1:8026 o http://mail.tueventofun.orb.local:8025
  # (8026 en el host para convivir con el Mailpit de micitaentiempo, que usa 8025).
  mailpit:
    image: axllent/mailpit:v1.31.5
    labels:
      dev.orbstack.domains: mail.tueventofun.orb.local
    environment:
      # Acepta cualquier usuario SMTP: así se ejercita la autenticación sin TLS
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:${MAIL_UI_PORT:-8026}:8025"
    restart: unless-stopped

  # Mismo gateway que producción: solo reparte el tráfico entre web y api
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    labels:
      dev.orbstack.domains: tueventofun.orb.local,en.tueventofun.orb.local
    environment:
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-127.0.0.1/32}
      ADMIN_HOST: ${ADMIN_HOST:-admin.tueventofun.orb.local}
    ports:
      - "127.0.0.1:${WEB_PORT:-5187}:80"
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped
    develop:
      watch:
        - path: services/gateway
          action: rebuild

  # Frontend: Vite con recarga en caliente detrás de un Nginx con el idioma por dominio
  web:
    build:
      context: .
      dockerfile: services/web/Dockerfile
      target: dev
    environment:
      SITE_URL_ES: ${SITE_URL_ES:-https://tueventofun.orb.local}
      SITE_URL_EN: ${SITE_URL_EN:-https://en.tueventofun.orb.local}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped
    develop:
      watch:
        - path: apps/web/src
          target: /app/apps/web/src
          action: sync
        - path: packages/app/src
          target: /app/packages/app/src
          action: sync
        - path: packages/contracts/src
          target: /app/packages/contracts/src
          action: sync
        - path: packages/client/src
          target: /app/packages/client/src
          action: sync
        - path: services/web
          action: rebuild
        - path: package.json
          action: rebuild
        - path: package-lock.json
          action: rebuild

  # ── SOLO PARA PRUEBAS · NO SE DESPLIEGA ───────────────────────────────────────
  # HTTPS local (https://localhost:8443) con una CA propia para probar las apps móviles
  # en el emulador de Android o el simulador de iOS. Perfil `mobile`: no arranca con un
  # `docker compose up` normal.
  #   docker compose --profile mobile up -d mobile-tls && bash scripts/mobile-test-ca.sh
  # No existe en compose.prod.yml; `npm test` (scripts/check-test-only.mjs) lo vigila.
  mobile-tls:
    profiles: ["mobile"]
    image: caddy:2.11.7-alpine
    labels:
      tuevento.solo-pruebas: "true"
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./services/mobile-tls/Caddyfile:/etc/caddy/Caddyfile:ro
      - mobile_tls_data:/data
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  mobile_tls_data:
  postcard_images:
