{
  "openapi": "3.1.0",
  "info": {
    "title": "TuEventoFun: paleta global",
    "version": "1.0.0",
    "description": "Contrato del endpoint público de paleta; la paleta solo se cambia en el panel de administración."
  },
  "servers": [
    {
      "url": "/api"
    }
  ],
  "paths": {
    "/site-palette": {
      "get": {
        "summary": "Consultar la paleta pública activa",
        "responses": {
          "200": {
            "description": "Paleta global activa",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string"
                },
                "description": "no-store"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SitePalette"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "SitePalette": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "palette"
        ],
        "properties": {
          "palette": {
            "type": "string",
            "enum": [
              "terracotta",
              "fuchsia-plum-amber",
              "plum-champagne",
              "mandarin-raspberry",
              "raspberry-vanilla",
              "ocean-aqua",
              "forest-mint",
              "indigo-ice",
              "petrol-lime"
            ]
          }
        }
      }
    }
  }
}
